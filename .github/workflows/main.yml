name: Python Tests with Pytest

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
    
    - name: Run tests with pytest
      run: |
        cd Lab9
        python -m pytest test_github_actions.py -v --tb=short
    
    - name: Run tests with coverage
      run: |
        cd Lab9
        python -m pytest test_github_actions.py -v --cov=. --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./Lab9/coverage.xml
        flags: unittests
    
    - name: Run specific test categories
      run: |
        cd Lab9
        python -m pytest test_github_actions.py::TestArithmeticOperations -v
        python -m pytest test_github_actions.py::TestStringOperations -v
    
    - name: Run tests without slow markers
      run: |
        cd Lab9
        python -m pytest test_github_actions.py -v -m "not slow"
    
    - name: Test failure case
      continue-on-error: true
      run: |
        cd Lab9
        python -m pytest test_github_actions.py -v -k "nonexistent" || true
  
  lint:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install linting tools
      run: |
        pip install flake8 black isort
    
    - name: Check code formatting with black
      run: |
        cd Lab9
        black --check --diff test_github_actions.py || true
    
    - name: Check import sorting with isort
      run: |
        cd Lab9
        isort --check-only --diff test_github_actions.py || true
    
    - name: Lint with flake8
      run: |
        cd Lab9
        flake8 test_github_actions.py --max-line-length=100 --show-source
  
  report:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Generate test report
      run: |
        echo "Test and linting jobs completed!"
        echo "Python versions tested: 3.8, 3.9, 3.10, 3.11, 3.12"
        echo "All tests should pass for the workflow to be successful."
    
    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          ./Lab9/coverage.xml
          ./Lab9/htmlcov/
        retention-days: 7
